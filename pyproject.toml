[project]
name = "data-platform-copilot"
version = "0.1.0"
description = "Chat with your data platform: RAG over dbt metadata with a read-only SQL tool"
readme = "README.md"
authors = [
    { name = "Vignesh Murugan", email = "vigneshmurugan11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
data-platform-copilot = "data_platform_copilot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
